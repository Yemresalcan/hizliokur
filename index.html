<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>HızlıOkur</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            background: '#0a0a0a', // Pure black
            surface: '#121212', // Slightly lighter
            surfaceHighlight: '#1e1e1e',
            primary: '#ffffff',
            secondary: '#a1a1aa',
            accent: '#8b5cf6', // Violet 500
            accentGlow: 'rgba(139, 92, 246, 0.5)',
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'fade-in-up': 'fadeInUp 0.5s ease-out',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Hide scrollbar for cleaner mobile UI */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    .glass-panel {
      background: rgba(18, 18, 18, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-panel-light {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>

<body class="bg-background text-primary overflow-hidden selection:bg-accent selection:text-white font-sans antialiased">
  <div id="root" class="h-full w-full absolute inset-0"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
